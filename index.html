<style>
:root{
  --bg:#EDF1F7; --surface:#FFFFFF; --surface-2:#F4F6FB; --surface-3:#E6EBF4; --ink:#18203A; --muted:#5B6580; --line:#D8DEEA;
  --accent:#3355E0; --accent-soft:#E4E9FD; --accent-ink:#FFFFFF; --sun:#FFC83D; --sun-soft:#FFF3CF; --sun-ink:#5A4300;
  --sw:#E0402E; --ps:#1E5CC4; --pc:#1F7A8C; --retro:#7A4FC9; --good:#1F8A5B; --good-soft:#DDF3E8; --heart:#D6336C; --heart-soft:#FBE3EC;
  --h1:#1F8A5B; --h2:#C98A00; --h3:#D0531F; --mark:#FFE58A;
  --shadow:0 1px 2px rgba(24,32,58,.06),0 6px 18px rgba(24,32,58,.07);
  --pop:0 12px 40px rgba(24,32,58,.18);
  --scrim:rgba(15,20,36,.55);
  --display:"Fredoka",ui-rounded,"Nunito Sans",system-ui,sans-serif;
  --body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1424; --surface:#182036; --surface-2:#1E2741; --surface-3:#26304D; --ink:#E8ECF7; --muted:#9AA5C2; --line:#2C3754;
    --accent:#7B93FF; --accent-soft:#232F58; --accent-ink:#0F1424; --sun:#FFC83D; --sun-soft:#3A3217; --sun-ink:#FFE08A;
    --sw:#FF6A57; --ps:#6E9CFF; --pc:#4FC3D9; --retro:#B592FF; --good:#4CC28A; --good-soft:#173A2B; --heart:#FF6FA0; --heart-soft:#3D1B2A;
    --h1:#4CC28A; --h2:#FFC83D; --h3:#FF8A5B; --mark:#6B5410;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.28); --pop:0 12px 40px rgba(0,0,0,.5); --scrim:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1424; --surface:#182036; --surface-2:#1E2741; --surface-3:#26304D; --ink:#E8ECF7; --muted:#9AA5C2; --line:#2C3754;
  --accent:#7B93FF; --accent-soft:#232F58; --accent-ink:#0F1424; --sun:#FFC83D; --sun-soft:#3A3217; --sun-ink:#FFE08A;
  --sw:#FF6A57; --ps:#6E9CFF; --pc:#4FC3D9; --retro:#B592FF; --good:#4CC28A; --good-soft:#173A2B; --heart:#FF6FA0; --heart-soft:#3D1B2A;
  --h1:#4CC28A; --h2:#FFC83D; --h3:#FF8A5B; --mark:#6B5410;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.28); --pop:0 12px 40px rgba(0,0,0,.5); --scrim:rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
button,a,input,select{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:1400px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;flex:none;text-decoration:none;color:inherit}
.logo{width:36px;height:36px;border-radius:11px;background:var(--accent);display:grid;place-items:center;flex:none}
.logo svg{width:26px;height:26px}
.brand b{font-family:var(--display);font-weight:600;font-size:21px;letter-spacing:-.01em;white-space:nowrap}
.sbox{flex:1;min-width:0;position:relative}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:0 6px 0 14px;height:44px}
.search:focus-within{border-color:var(--accent)}
.search svg{flex:none;opacity:.6}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:15.5px;height:100%;outline:none}
.search input::-webkit-search-cancel-button{display:none}
.search kbd{font:700 11px var(--body);color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.sclear{border:0;background:var(--surface-3);width:28px;height:28px;border-radius:50%;cursor:pointer;flex:none;font-size:13px;color:var(--muted)}
.suggest{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--pop);padding:6px;max-height:min(70vh,520px);overflow:auto;z-index:40}
.suggest h4{margin:8px 10px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:800}
.sitem{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;text-align:left;padding:7px 10px;border-radius:10px;cursor:pointer}
.sitem[aria-selected="true"],.sitem:hover{background:var(--accent-soft)}
.sitem .av{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.sitem .th{width:32px;height:42px;border-radius:5px;overflow:hidden;flex:none;background:var(--surface-3)}
.sitem .th img{width:100%;height:100%;object-fit:cover;display:block}
.sitem .fi{width:32px;height:32px;border-radius:9px;background:var(--surface-3);display:grid;place-items:center;flex:none;font-size:15px}
.sitem span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.sitem small{color:var(--muted);font-weight:700;font-size:12.5px;white-space:nowrap}
.tools{display:flex;gap:6px;flex:none}
.lang{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;border-radius:999px;padding:5px 10px;font-weight:800;font-size:12.5px;color:var(--muted);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.iconbtn{border:1px solid var(--line);background:var(--surface);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;cursor:pointer;flex:none;color:var(--ink)}
.iconbtn svg{width:19px;height:19px}
@media (max-width:640px){.brand b{display:none}.search kbd{display:none}.top-in{gap:8px}#themeBtn{display:none}
  .suggest{position:fixed;left:10px;right:10px;top:calc(62px + env(safe-area-inset-top,0px));max-height:calc(100vh - 80px)}}

/* ---------- layout ---------- */
.shell{max-width:1400px;margin:0 auto;padding:0 16px 104px;display:grid;grid-template-columns:272px 1fr;gap:26px;align-items:start}
@media (max-width:900px){.shell{grid-template-columns:1fr}}

/* ---------- filters ---------- */
.filters{position:sticky;top:calc(66px + env(safe-area-inset-top,0px));max-height:calc(100vh - 80px);overflow:auto;padding:18px 6px 24px 0;scrollbar-width:thin}
.fhead{display:none}
.fgroup{padding:14px 0;border-bottom:1px solid var(--line)}
.fgroup:first-child{padding-top:0}
.fgroup h3{margin:0 0 9px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip:disabled{opacity:.4;cursor:default;border-color:var(--line)}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chip small{font-weight:700;opacity:.7;font-variant-numeric:tabular-nums}
.range{display:flex;align-items:center;gap:10px}
.range input{flex:1;accent-color:var(--accent)}
.range output{font-weight:800;font-variant-numeric:tabular-nums;min-width:66px;text-align:right}
.hint{font-size:12.5px;color:var(--muted);margin:8px 0 0;line-height:1.45}
.reset{margin-top:14px;width:100%;border:1px dashed var(--line);background:transparent;border-radius:10px;padding:9px;font-weight:800;color:var(--muted);cursor:pointer}
.reset:hover{color:var(--ink);border-color:var(--ink)}
.apply{display:none}
@media (max-width:900px){

function lev(a,b,max){
  if(Math.abs(a.length-b.length)>max) return max+1;
  const m=a.length,n=b.length; let prev=new Array(n+1); for(let j=0;j<=n;j++) prev[j]=j;
  for(let i=1;i<=m;i++){ const cur=[i]; let best=i;
    for(let j=1;j<=n;j++){ cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); if(cur[j]<best) best=cur[j]; }
    if(best>max) return max+1; prev=cur; }
  return prev[n];
}

      else if(fz&&w>=4&&wd.length>=5&&lev(tok,wd,fz)<=fz) best=Math.max(best,w*.55);
    }
    if(w>=9&&tok.length>=4&&n.replace(/ /g,'').includes(tok)) best=Math.max(best,w*.6);
    // sinonimi: solo su titoli, personaggi, temi, generi e console (mai sul testo libero)
    if(w>=3) for(const a of syn) for(const wd of words){ if(wd===a||(a.length>=3&&wd.startsWith(a))) best=Math.max(best,w*.7); }
  }
  return best;
}
const PLAYERS_RE=/\b(\d)\s*(?:\+|piu)?\s*(giocatori|giocatore|players?|persone|people|bambini|kids)\b/;
function searchInfo(g,q){
  let qn=norm(q); if(!qn) return null;
  const pm=qn.match(PLAYERS_RE);
  if(pm){ if(g.pmax<+pm[1]) return null; qn=qn.replace(PLAYERS_RE,' ').replace(/\s+/g,' ').trim(); if(!qn) return {score:5,why:null}; }
  const toks=qn.split(' ').filter(Boolean), qj=qn.replace(/ /g,'');
  let score=0, why=null, fuzzy=false;
  // frase intera: titolo o personaggio (ignora spazi e trattini)
  if(g._titleJ.includes(qj)) score+=g._titleJ.startsWith(qj)?90:60;
  for(const c of g._chars){
    if(c.j.some(j=>j===qj)) { score+=80; why=c.c; break; }
    if(qj.length>=3&&c.j.some(j=>j.startsWith(qj))) { score+=55; why=c.c; break; }
    if(qj.length>=5&&c.j.some(j=>lev(qj,j,qj.length>=8?2:1)<=(qj.length>=8?2:1))) { score+=45; why=c.c; fuzzy=true; break; }
  }
  if(!score){
    let sum=0;
    for(const t of toks){ const s=tokenScore(g,t); if(!s) return null; sum+=s; }
    score=sum;
    if(!why){ for(const c of g._chars){ if(toks.every(t=>c.n.some(n=>n.split(' ').some(w=>w.startsWith(t)||(t.length>=5&&lev(t,w,1)<=1))))){ why=c.c; break; } } }
  }
  return {score,why,fuzzy};
}
let SCORES=null;
function computeScores(){
  SCORES=null; if(!S.q) return; SCORES=new Map();
  for(const g of G){ const r=searchInfo(g,S.q); if(r) SCORES.set(g.id,r); }
  // se ci sono risultati forti (titolo o personaggio), scarta quelli trovati solo per caso nel testo
  const top=Math.max(0,...[...SCORES.values()].map(r=>r.score));
  if(top>=45) for(const [id,r] of [...SCORES]) if(r.score<8) SCORES.delete(id);
  if([...SCORES.values()].some(r=>!r.fuzzy&&r.score>=45)) for(const [id,r] of [...SCORES]) if(r.fuzzy) SCORES.delete(id);
}
function searchGames(q){
  const out=[]; for(const g of G){ const r=searchInfo(g,q); if(r) out.push([r.score,g,r.fuzzy]); }
  const top=Math.max(0,...out.map(x=>x[0])); const exact=out.some(x=>!x[2]&&x[0]>=45);
  return out.filter(x=>(top<45||x[0]>=8)&&!(exact&&x[2])).sort((a,b)=>b[0]-a[0]);
}

const FDEF=[
 {k:'kidage',multi:0,vals:[2,3,4,5,6],fn:(g,v)=>g.age<=v,label:v=>L.kidage[v],hideIn:'adults'},
 {k:'console',multi:1,vals:['sw','s2','ps','pc','old'],fn:(g,v)=>v==='sw'?g.sw:v==='s2'?(g.sw||g.s2):v==='ps'?g.ps:v==='pc'?!!g.pc:(!!g.orig&&!g.sw&&!g.s2&&!g.ps&&!g.pc),label:v=>L.console[v]},
 {k:'era',multi:1,vals:['modern','retro'],fn:(g,v)=>v==='retro'?!!g.orig:!g.orig,label:v=>L.era[v]},
 {k:'help',multi:1,vals:['1','2','3'],fn:(g,v)=>g.a===+v,label:v=>L.help[v],dot:v=>`var(--h${v})`,hideIn:'adults'},
 {k:'players',multi:0,vals:[2,3,4],fn:(g,v)=>g.pmax>=v,label:v=>L.players[v]},
 {k:'cat',multi:1,vals:['adventure','platform','puzzle','chaos','party','racing','sports','fight','action','rpg','strategy','sandbox'],fn:(g,v)=>g.cats.includes(v),label:v=>L.cat[v]},
 {k:'theme',multi:1,vals:['hero','lego','nintendo','kirby','sonic','disney','tv','dino','pokemon','animals'],fn:(g,v)=>g.tags.includes(v),label:v=>L.theme[v]},
 {k:'viol',multi:1,vals:['none','cartoon','mild','strong'],fn:(g,v)=>VIOL[g.v]===v,label:v=>L.viol[v]},
 {k:'dur',multi:1,vals:['short','mid','long','endless'],fn:(g,v)=>durKey(g)===v,label:v=>L.dur[v]},
 {k:'rating',multi:0,vals:[3,4,5],fn:(g,v)=>g.s>=v,label:v=>L.rating[v]},
];
const FD=Object.fromEntries(FDEF.map(d=>[d.k,d]));
const whoOk=g=>S.who==='kids'?g.age<=7:S.who==='adults'?g.ad===3:true;
function passes(g,skip){
  const f=S.f;
  if(!whoOk(g)) return false;
  for(const d of FDEF){
    if(d.k===skip||d.hideIn===S.who) continue;
    const val=f[d.k];
    if(d.multi){ if(val.length&&!val.some(v=>d.fn(g,v))) return false; }
    else if(val&&!d.fn(g,val)) return false;
  }
  if(skip!=='price'){
    if(f.free&&minPrice(g)!==0) return false;
    if(f.price){ const v=minPrice(g); if(v==null||v>f.price) return false; }
  }
  if(S.char&&!g.ch.includes(S.char)) return false;
  if(SCORES&&!SCORES.has(g.id)) return false;
  return true;
}
function inTab(g){
  if(S.tab==='saved') return savedSet().has(g.id); if(S.tab==='tried') return triedSet().has(g.id);
  if(S.tab==='quiz') return !!(S.quiz&&S.quiz.ids&&S.quiz.ids.includes(g.id));
  return true;
}
const prP=g=>{const r=recPlat(g);return r==='sw'||r==='s2'?0:r==='ps'?1:2;};
const FIT={
  kids:(a,b)=>a.age-b.age||a.e-b.e||a.a-b.a||prP(a)-prP(b)||b.s-a.s||title(a).localeCompare(title(b)),
  adults:(a,b)=>(a.cp||999)-(b.cp||999)||b.ad-a.ad||b.s-a.s||(!!a.orig-!!b.orig)||a.e-b.e||prP(a)-prP(b)||title(a).localeCompare(title(b)),
  all:(a,b)=>b.s-a.s||(!!a.orig-!!b.orig)||b.ad-a.ad||a.age-b.age||prP(a)-prP(b)||title(a).localeCompare(title(b))
};
const SORTS={
  fit:(a,b)=>(FIT[S.who]||FIT.all)(a,b),
  relevance:(a,b)=>(SCORES.get(b.id).score-SCORES.get(a.id).score)||SORTS.fit(a,b),
  rating:(a,b)=>b.s-a.s||a.e-b.e||prP(a)-prP(b),
  price:(a,b)=>{const pa=minPrice(a),pb=minPrice(b);return (pa==null?999:pa)-(pb==null?999:pb)||b.s-a.s;},
  short:(a,b)=>(a.h==null?999:a.h)-(b.h==null?999:b.h)||b.s-a.s,
  az:(a,b)=>title(a).localeCompare(title(b),S.lang)
};
function currentSort(){ return SCORES&&S.sort==='fit'?'relevance':S.sort; }
function list(){
  const l=G.filter(g=>inTab(g)&&passes(g));
  if(S.tab==='quiz'&&currentSort()==='fit'){ const rank=new Map(S.quiz.ids.map((id,i)=>[id,i])); return l.sort((a,b)=>rank.get(a.id)-rank.get(b.id)); }
  return l.sort(SORTS[currentSort()]||SORTS.fit);
}

let sugItems=[], sugIdx=-1;
function renderSuggest(){
  const box=$('suggest'); const q=$('q').value.trim(); const qn=norm(q);
  if(qn.length<2){ box.hidden=true; $('q').setAttribute('aria-expanded','false'); sugItems=[]; return; }

  // personaggi
  const chars=[];
  for(const c of Object.keys(CHARS)){
    const names=[c,CHARS[c].it,CHARS[c].x].filter(Boolean).map(norm);
    let s=0;
    for(const n of names){ const j=n.replace(/ /g,''); if(j===qj) s=Math.max(s,100); else if(j.startsWith(qj)) s=Math.max(s,80); else if(n.split(' ').some(w=>w.startsWith(qn))) s=Math.max(s,70); else if(qj.length>=4&&n.split(' ').concat([j]).some(w=>lev(qj,w,qj.length>=7?2:1)<=(qj.length>=7?2:1))) s=Math.max(s,50); }
    if(s) chars.push([s,c,G.filter(g=>g.ch.includes(c)).length]);
  }
  chars.sort((a,b)=>b[0]-a[0]||b[2]-a[2]);
  // giochi
  const games=searchGames(q);
  // filtri
  const filt=[];
  for(const [k,labels] of [['theme',L.theme],['cat',L.cat]]){ for(const v of Object.keys(labels)){ const n=norm(labels[v]); if(n.split(' ').some(w=>w.startsWith(qn))||n.startsWith(qn)||(SYN[qn]&&SYN[qn].split(' ').some(s=>n.split(' ').some(w=>w.startsWith(s))))) filt.push([k,v,labels[v]]); } }
  sugItems=[]; let h='';
  const ch=chars.slice(0,4);
  if(ch.length){ h+=`<h4>${esc(L.sChars)}</h4>`; ch.forEach(([,c,n])=>{ sugItems.push({t:'c',v:c}); h+=`<button type="button" class="sitem" role="option" data-si="${sugItems.length-1}"><span class="av">${esc(charName(c)[0])}</span><span>${esc(charName(c))}</span><small>${esc(L.gamesN(n))}</small></button>`; }); }
  const gm=games.slice(0,5);

const FAMILY=/^(lego-marvel|lego-batman|lego|mario-party|super-mario-party|mario-kart|kirby|my-little-pony|katamari|we-love-katamari|paw-patrol|gigantosaurus|moving-out|trine|donkey-kong|tmnt|nickelodeon|sonic|mario-tennis|hot-wheels|toejam|borderlands|tiny-tina|resident-evil|portal|cat-quest|hyrule-warriors|diablo|divinity|baldurs|metal-slug|streets-of-rage|it-takes-two|split-fiction)/;

function quizAvail(g,a){
  const c=a.console||[]; if(!c.length) return true;
  return (c.includes('sw')&&g.sw)||(c.includes('s2')&&(g.sw||g.s2))||(c.includes('ps')&&g.ps)||(c.includes('pc')&&g.pc)||(c.includes('old')&&!!g.orig&&!g.sw&&!g.s2&&!g.ps&&!g.pc);
}
function quizPlatPrice(g,a){ // piattaforma consigliata tra quelle scelte + prezzo
  const c=a.console||['sw','s2','ps','pc','old']; const p=g.pr||{};
  if((c.includes('sw')||c.includes('s2'))&&(g.sw||(g.s2&&c.includes('s2')))) return [g.sw?'Switch':'Switch 2',p.dig!=null||p.phy!=null||p.used!=null?Math.min(...[p.dig,p.phy,p.used].filter(x=>typeof x==='number')):null];
  if(c.includes('ps')&&g.ps) return ['PlayStation',[p.phy,p.used].filter(x=>typeof x==='number').length?Math.min(...[p.phy,p.used].filter(x=>typeof x==='number')):null];
  if(c.includes('pc')&&g.pc) return ['PC',typeof p.steam==='number'?p.steam:null];
  return [consoleName(g)||'',typeof p.used==='number'?p.used:null];

function recommend(a){
  QRELAX=null;
  let r=recommendStrict(a,{});
  if(r.length<4&&a.age==='2'){ const r3=recommendStrict(Object.assign({},a,{age:'3',orig2:1}),{}); if(r3.length>r.length){ r=r3; QRELAX='age2'; } }
  if(!r.length&&a.budget&&a.budget!=='any'){ r=recommendStrict(a,{budget:1}); if(r.length) QRELAX='budget'; }
  if(!r.length&&+(a.players||2)>2){ r=recommendStrict(a,{budget:1,players:1}); if(r.length) QRELAX='players'; }
  return r;
}
function recommendStrict(a,rx){
  const W=L.quiz.why, kidM=!isAdult(a), fam=a.who==='family';
  const pl=rx.players||a.who==='couple'?2:+(a.players||2);
  const kid=kidM?(+a.age||8):99;
  const ageCap={2:1,3:1,4:2,5:3,6:3,8:3}[kid]||3, expCap=+(a.exp||3), maxE=Math.min(ageCap,expCap);
  const gamer=+(a.gamer||2);
  const loves=kidM?(a.loves||[]):(a.likes||[]), out=[];
  for(const g of G){
    if(g.pmax<pl||!quizAvail(g,a)) continue;
    const [plat,price]=quizPlatPrice(g,a);
    if(!rx.budget&&a.budget&&a.budget!=='any'&&(price==null||price>+a.budget)) continue;
    let sc=g.s*6, lk=[]; const why=[];
    if(kidM){
      // l'età è indicativa: si accettano anche i giochi di un anno più avanti, un po' più in basso in classifica
      const over=g.age-kid;
      if(over>1||g.e>maxE+1) continue;
      if(kid<=3&&VIOL[g.v]!=='none') continue;
      if(over===1){ sc-=kid<=3?25:12; why.push(W.ageUp(g.age)); } else if(kid<=3) why.push(W.age(g.age));
      if(g.e>maxE) sc-=10;
      if(a.orig2&&g.age<=2) sc+=20;  // bambino di 2 anni: prima i giochi davvero da 2 anni
      if(fam){ sc+=g.ad*6; if(g.ad===3) why.push(W.grown); }
      lk=loves.filter(k=>LOVE[k](g));
      if(lk.length){
        sc+=30+(lk.length>1?8:0);
        const names=[...new Set(lk.flatMap(k=>(LOVE_CH[k]||[]).filter(c=>g.ch.includes(c))))].slice(0,2).map(charName);
        why.push(names.length?W.chars(names.join(S.lang==='it'?' e ':' and ')):W.love(lk.map(k=>qLabel('loves',k).toLowerCase()).join(', ')));
      }
      const st=a.style&&a.style!=='any'?a.style:null;
      if(st&&STYLE[st](g)){ sc+=15; why.push(W[st]); } else if(!st) sc+=8;
      if(g.e===1&&maxE<=2){ sc+=10; why.push(W.easy); } else if(g.e===maxE) { sc+=5; why.push(W.ok); }
      if(g.sw) sc+=3;
    } else {
      if(g.ad<2) continue;
      if(a.mature==='no'&&VIOL[g.v]==='strong') continue;
      sc+=g.ad*8; if(g.ad===3) why.push(W.adults);
      if(g.cp) sc+=Math.max(2,14-g.cp/3);   // i grandi classici da coppia
      lk=loves.filter(k=>LIKE[k](g));
      if(lk.length){ sc+=30+(lk.length>1?8:0); why.push(W.love(lk.map(k=>qLabel('likes',k).toLowerCase()).join(', '))); }
      const diff=g.e-gamer;
      if(diff>0) sc-=12*diff; else if(gamer===3&&g.e===1) sc-=6;
      if(gamer===1&&g.e===1) why.push(W.beginner); else if(gamer===3&&g.e===3) why.push(W.challenge);
      if(a.who==='couple'&&g.pl==='2'){ sc+=6; why.push(W.forTwo); }
      if(g.orig) sc-=4;
    }
    if(g.s===5) why.push(W.top);
    if(pl>=3) why.push(W.players(g.pmax));
    why.push(W.where(plat,price==null?'':price===0?W.free:W.from(eur(price))));
    const good=!loves.length||lk.length>0;
    out.push({g,sc,good,why:why.slice(0,4)});
  }
  // percentuale rispetto al massimo raggiungibile con queste risposte
  const maxP=kidM?30+(fam?18:0)+(loves.length?38:0)+(a.style&&a.style!=='any'?15:8)+(maxE<=2?10:5)+3:30+24+14+(loves.length?38:0)+(a.who==='couple'?6:0);
  out.forEach(x=>x.pct=Math.max(1,Math.min(99,Math.round(x.sc/maxP*100))));
  out.sort((x,y)=>(y.good-x.good)||y.sc-x.sc||title(x.g).localeCompare(title(y.g)));
  // varietà: nei primi posti al massimo un gioco per serie
  const top=[], seen=new Set(), rest=[];
  for(const x of out){ const f=family(x.g); if(top.length<6&&!seen.has(f)){ top.push(x); seen.add(f); } else rest.push(x); }
  const all=top.concat(rest);
  const good=all.filter(x=>x.good);
  return good.length>=6?good:all.slice(0,Math.max(good.length,Math.min(6,all.length)));
}
function openQuiz(){ QZ={i:0,ans:{}}; renderQuiz(); $('quiz').hidden=false; document.body.style.overflow='hidden'; try{ history.pushState({qz:1},''); }catch(e){} }
function closeQuiz(fromPop){
  if($('quiz').hidden) return;
  $('quiz').hidden=true; if(!openId) document.body.style.overflow='';
  if(!fromPop){ try{ if(history.state&&history.state.qz) history.back(); }catch(e){} }
}
function renderQuiz(){
  const Q=L.quiz, qs=qlist(), n=qs.length;
  if(QZ.i>=n) return renderQuizResults();
  const q=qs[QZ.i], val=QZ.ans[q.id];
  const sel=v=>q.m?(val||[]).includes(v):val===v;
  const ok=q.m?(!q.req||(val&&val.length)):val!=null;
  const nextLabel=q.m&&!q.req&&!(val&&val.length)?Q.skip:(QZ.i===n-1?Q.done:Q.next);
  $('qsheet').innerHTML=`<div class="qin"><div class="qtop"><div class="qprog"><i style="width:${(QZ.i+1)/(n+1)*100}%"></i></div><span class="qstep">${esc(Q.step(QZ.i+1,n))}</span><button class="qx" type="button" id="qx" aria-label="${esc(Q.close)}">✕</button></div>
   <h2>${esc(q.t)}</h2><p class="qhint">${esc(q.h)}</p>
   <div class="qopts${q.o.length>8?' many':''}" role="group">${q.o.map(([v,ic,l])=>`<button type="button" class="qopt" data-qv="${v}" aria-pressed="${sel(v)}"><span class="qi" aria-hidden="true">${ic}</span>${esc(l)}</button>`).join('')}</div>
   <div class="qnav"><button type="button" id="qback" ${QZ.i?'':'disabled'}>‹ ${esc(Q.back)}</button>${q.m?`<button type="button" class="qnext" id="qnext" ${ok?'':'disabled'}>${esc(nextLabel)} ›</button>`:''}</div></div>`;
  $('qsheet').scrollTop=0;
}
let QRES=[];
function renderQuizResults(){
  const Q=L.quiz; const r=recommend(QZ.ans); QRES=r;
  S.quiz={ans:QZ.ans,ids:r.map(x=>x.g.id)}; persist();
  const img=thumb;
  const best=r[0], more=r.slice(1,6);
  $('qsheet').innerHTML=`<div class="qin"><div class="qtop"><div class="qprog"><i style="width:100%"></i></div><button class="qx" type="button" id="qx" aria-label="${esc(Q.close)}">✕</button></div>
   ${QRELAX?`<p class="qwarn">${esc(Q.relax[QRELAX])}</p>`:''}
   ${best?`<h2>${esc(Q.resT)}</h2>
   <button type="button" class="qbest" data-qg="${best.g.id}"><div class="qbimg">${img(best.g)?`<img src="${img(best.g)}" alt="">`:''}<span class="qpct">${esc(Q.match(best.pct))}</span></div>
     <div class="qbtx"><b>${esc(title(best.g))}</b><div class="plats">${platChips(best.g,true)}</div><ul>${best.why.map(w=>`<li>${esc(w)}</li>`).join('')}</ul><span class="qopen">${esc(Q.open)} ›</span></div></button>
   ${more.length?`<h3 class="qmore">${esc(Q.moreT)}</h3><div class="qres">${more.map(x=>`<button type="button" class="qr" data-qg="${x.g.id}"><div class="qimg">${img(x.g)?`<img src="${img(x.g)}" alt="">`:''}</div><div class="qtx"><span class="rank">${esc(Q.match(x.pct))}</span><b>${esc(title(x.g))}</b><div class="why2">${x.why.slice(0,3).map(w=>`<span>${esc(w)}</span>`).join('')}</div></div></button>`).join('')}</div>`:''}
   <p class="qtotal">${esc(Q.resH(r.length))}</p>`:`<h2>${esc(Q.resT)}</h2><p class="qhint">${esc(Q.none)}</p>`}
   <div class="qnav qend"><button type="button" id="qagain">↺ ${esc(Q.again)}</button>${r.length?`<button type="button" id="qsave">${esc(Q.saveAll)}</button><button type="button" class="qnext" id="qall">${esc(Q.all(r.length))} ›</button>`:''}</div></div>`;
  $('qsheet').scrollTop=0;
  renderTabs();
}
$('quizBtn').addEventListener('click',openQuiz);
$('quiz').addEventListener('click',e=>{
  if(e.target===$('quiz')||e.target.closest('#qx')) return closeQuiz();
  const o=e.target.closest('.qopt');
  if(o){ const q=qlist()[QZ.i], v=o.dataset.qv;
    if(q.m){ const a=QZ.ans[q.id]||[]; const i=a.indexOf(v); i>=0?a.splice(i,1):a.push(v); QZ.ans[q.id]=a; renderQuiz(); }
    else { QZ.ans[q.id]=v; renderQuiz(); setTimeout(()=>{ const l=qlist(); if(QZ.i<l.length&&l[QZ.i].id===q.id){ QZ.i++; renderQuiz(); } },220); }
    return; }
  if(e.target.closest('#qback')){ QZ.i=Math.max(0,QZ.i-1); return renderQuiz(); }
  if(e.target.closest('#qnext')){ QZ.i++; return renderQuiz(); }
  if(e.target.closest('#qagain')){ QZ={i:0,ans:{}}; return renderQuiz(); }
  if(e.target.closest('#qsave')){ const s=new Set(S.saved); QRES.slice(0,6).forEach(x=>s.add(x.g.id)); S.saved=[...s]; persist(); renderTabs(); e.target.closest('#qsave').textContent=L.quiz.savedAll; toast(L.quiz.savedAll); return; }
  if(e.target.closest('#qall')){ closeQuiz(true); try{history.replaceState({},'');}catch(_){} S.tab='quiz'; S.who='all'; S.f=JSON.parse(JSON.stringify(DEF.f)); S.q=''; S.char=''; $('q').value=''; $('qclear').hidden=true; S.sort='fit'; renderChrome(); render(); window.scrollTo({top:0}); return; }
  const r=e.target.closest('[data-qg]'); if(r){ closeQuiz(true); try{history.replaceState({},'');}catch(_){} navList=S.quiz.ids.slice(); detail(r.dataset.qg,{keepNav:true}); }
});

/* ================= copia lista ================= */
async function copyList(){
  const sv=savedSet(); const l=list().filter(g=>sv.has(g.id));
  const lines=[`♥ ${L.copyHead} — ${L.app}`,''].concat(l.map(g=>{const p=minPrice(g)!=null?`${L.from} ${eur(minPrice(g))}`:''; return `• ${title(g)} (${platLabel(g)})${p?' — '+p:''}`;}));
  const text=lines.join('\n');
  try{ await navigator.clipboard.writeText(text); toast(L.copied); }
  catch(e){ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); let ok=false; try{ok=document.execCommand('copy');}catch(_){ } ta.remove(); toast(ok?L.copied:L.copyFail); }
}

/* ================= eventi ================= */
document.querySelector('.lang').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.lang=b.dataset.lang;L=T[S.lang];renderChrome();render(); if(openId) detail(openId,{keepNav:true}); if(!$('quiz').hidden) renderQuiz();});
$('themeBtn').addEventListener('click',()=>{S.theme={auto:'light',light:'dark',dark:'auto'}[S.theme]; applyTheme(); persist(); toast(L.themeMode[S.theme]);});
let qTimer=null;
$('q').addEventListener('input',e=>{
  $('qclear').hidden=!e.target.value;
  renderSuggest();
  clearTimeout(qTimer); qTimer=setTimeout(()=>{ S.q=e.target.value.trim(); if(S.q) S.char=''; S.tab='all'; render(); },120);
});
$('q').addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){e.preventDefault();moveSug(1);}
  else if(e.key==='ArrowUp'){e.preventDefault();moveSug(-1);}
  else if(e.key==='Enter'){ if(sugIdx>=0&&sugItems[sugIdx]){e.preventDefault();pickSuggest(sugItems[sugIdx]);} else { closeSuggest(); $('q').blur(); } }
  else if(e.key==='Escape'){ if(!$('suggest').hidden) closeSuggest(); else { $('q').value=''; $('q').dispatchEvent(new Event('input')); } }
});
$('q').addEventListener('focus',()=>{ if($('q').value.trim()) renderSuggest(); });
$('qclear').addEventListener('click',()=>{ $('q').value=''; $('q').dispatchEvent(new Event('input')); $('q').focus(); });
$('suggest').addEventListener('mousedown',e=>e.preventDefault());
$('suggest').addEventListener('click',e=>{const b=e.target.closest('.sitem'); if(b) pickSuggest(sugItems[+b.dataset.si]);});
document.addEventListener('click',e=>{ if(!e.target.closest('#sbox')) closeSuggest(); });
$('sort').addEventListener('change',e=>{S.sort=e.target.value==='relevance'?'fit':e.target.value;renderGrid();persist();});
$('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.tab=b.dataset.tab;renderTabs();renderGrid();persist();});
$('view').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.view=b.dataset.view;renderChrome();persist();});
$('copyList').addEventListener('click',copyList);
function setFilter(k,v){
  const d=FD[k];
  if(d.multi){const a=d.vals.map(String).includes(String(v))?S.f[k].map(String):[];const i=a.indexOf(String(v));i>=0?a.splice(i,1):a.push(String(v));S.f[k]=a;}
  else {const nv=isNaN(+v)?v:+v; S.f[k]=(nv&&S.f[k]!==nv)?nv:0;}
}
$('fbody').addEventListener('click',e=>{
  const b=e.target.closest('.chip'); if(!b||b.disabled) return;
  if(b.id==='free'){S.f.free=!S.f.free;} else setFilter(b.dataset.f,b.dataset.v);
  render();
});
$('fbody').addEventListener('input',e=>{
  if(e.target.id!=='price') return;
  const v=+e.target.value; S.f.price=v>=80?0:v; $('pout').textContent=S.f.price?eur(S.f.price):L.anyPrice;
  clearTimeout(qTimer); qTimer=setTimeout(()=>{ renderQuick(); renderActive(); renderTabs(); renderGrid(); persist(); const n=activeCount()+(S.char?1:0); $('fcount').textContent=n; $('fcount').hidden=!n; },60);
});
$('fbody').addEventListener('change',e=>{ if(e.target.id==='price') renderFilters(); });
$('quick').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  const p=quickList()[+b.dataset.qi][2]; const k=Object.keys(p)[0], v=p[k];
  if(quickMatch(p)) S.f[k]=Array.isArray(v)?[]:0; else S.f[k]=Array.isArray(v)?v.slice():v;
  render();
});
$('active').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  const f=b.dataset.f;
  if(f==='all'){ S.f=JSON.parse(JSON.stringify(DEF.f)); S.q=''; S.char=''; $('q').value=''; $('qclear').hidden=true; }
  else if(f==='q'){ S.q=''; $('q').value=''; $('qclear').hidden=true; }
  else if(f==='char') S.char='';
  else if(f==='price') S.f.price=0; else if(f==='free') S.f.free=false;
  else { const d=FD[f]; if(d.multi) S.f[f]=S.f[f].filter(v=>String(v)!==b.dataset.v); else S.f[f]=0; }
  render();
});
$('reset').addEventListener('click',()=>{S.f=JSON.parse(JSON.stringify(DEF.f));S.char='';render();});
$('fopen').addEventListener('click',()=>{$('filters').classList.add('open');document.body.style.overflow='hidden';try{history.pushState({f:1},'');}catch(e){}});
const closeF=(fromPop)=>{ if(!$('filters').classList.contains('open')) return; $('filters').classList.remove('open');document.body.style.overflow=''; if(!fromPop){try{if(history.state&&history.state.f) history.back();}catch(e){}} };
$('fclose').addEventListener('click',()=>closeF()); $('apply').addEventListener('click',()=>{closeF();window.scrollTo({top:0});});
$('grid').addEventListener('click',e=>{
  const dm=e.target.closest('[data-dym]'); if(dm){ if(dm.dataset.dym==='c') setChar(dm.dataset.v); else detail(dm.dataset.v); return; }
  const c=e.target.closest('.card'); if(c) detail(c.dataset.id);
});
// anteprima foto al passaggio del mouse
let hoverT=null;
$('grid').addEventListener('mouseover',e=>{
  if(reduced||matchMedia('(hover: none)').matches) return;
  const c=e.target.closest('.card'); if(!c||c._hov) return;
  const im=IMGS[c.dataset.id]; if(!im||!im.t||im.t.length<2) return;
  c._hov=true; let i=0; const img=c.querySelector('.shot>img'); if(!img) return;
  const first=img.src;
  clearInterval(hoverT); hoverT=setInterval(()=>{ i=(i+1)%im.t.length; const nx=new Image(); nx.onload=()=>{ if(c._hov) img.src=nx.src; }; nx.src=src(im.t[i]); },900);
  c.addEventListener('mouseleave',()=>{ clearInterval(hoverT); c._hov=false; img.src=first; },{once:true});
});
$('surprise').addEventListener('click',surprise);
$('who').addEventListener('click',e=>{
  const b=e.target.closest('[data-who]'); if(!b||b.dataset.who===S.who) return;
  S.who=b.dataset.who; if(S.who==='adults'){ S.f.kidage=0; S.f.help=[]; } if(S.tab==='quiz') S.tab='all';
  renderChrome(); render();
});

/* ================= aggiornamento automatico ================= */
// Prezzi (ogni settimana) e libreria (quando aggiungiamo giochi) arrivano dal sito, anche nel file offline e nel programma.
function applyData(d){
  const keep=IMGS;
  G.splice(0,G.length,...d.games);
  Object.assign(META,d.meta,{mode:META.mode}); CHARS=META.chars;
  for(const [id,im] of Object.entries(d.imgs||{})) if(!keep[id]) keep[id]=im;   // le immagini già incorporate restano
  BYID=Object.fromEntries(G.map(g=>[g.id,g]));
}
function applyPrices(pj){
  for(const g of G){ const p=pj.p&&pj.p[g.id]; if(!p) continue; g.pr=g.pr||{}; for(const k of ['dig','phy','used','steam']) if(typeof p[k]==='number') g.pr[k]=p[k]; }
  if(pj.date) META.date=pj.date;
}
async function refresh(){
  const base=META.mode==='site'?'':REMOTE, bust='?t='+Math.floor(Date.now()/36e5);
  const getJ=async u=>{ try{ const r=await fetch(base+u+bust,{cache:'no-cache'}); return r.ok?await r.json():null; }catch(e){ return null; } };
  let changed=false;
  if(META.mode!=='site'){ const d=await getJ('data.json'); if(d&&d.meta&&d.games&&d.meta.version>META.version){ applyData(d); changed=true; } }
  const pj=await getJ('prices.json'); if(pj&&pj.p&&pj.version>(META.pv||META.version)){ applyPrices(pj); META.pv=pj.version; changed=true; }
  if(!changed) return;
  buildIndex(); renderChrome(); render();
  if(openId) detail(openId,{keepNav:true});
}
$('home').addEventListener('click',e=>{e.preventDefault(); window.scrollTo({top:0,behavior:reduced?'auto':'smooth'});});
$('scrim').addEventListener('click',e=>{
  if(e.target===$('scrim')||e.target.closest('#dclose')) return closeDetail();
  if(e.target.closest('#dprev')) return navGame(-1);
  if(e.target.closest('#dnext')) return navGame(1);
  if(e.target.closest('#again')) return surprise();
  const n=e.target.closest('.gnav'); if(n) return galleryGo(+n.dataset.g);
  const d=e.target.closest('[data-dot]'); if(d) return galleryGo(0,+d.dataset.dot);
  if(e.target.closest('#gfull')||(e.target.tagName==='IMG'&&e.target.closest('#gtrack'))){
    const gl=$('gallery'); if(!gl||!document.fullscreenEnabled) return;
    if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); else gl.requestFullscreen().catch(()=>{});
    return;
  }
  const ch=e.target.closest('[data-char]'); if(ch){ closeDetail(); setChar(ch.dataset.char); return; }
  const sm=e.target.closest('[data-sim]'); if(sm){ navList=[sm.dataset.sim]; detail(sm.dataset.sim,{keepNav:true}); return; }
  if(e.target.closest('#bsave')) return toggle('saved',openId);
  if(e.target.closest('#btried')) return toggle('tried',openId);
});
window.addEventListener('popstate',()=>{
  const st=history.state||{};
  if(!$('quiz').hidden&&!st.qz) closeQuiz(true);
  if(openId&&!st.d) closeDetail(true);
  if($('filters').classList.contains('open')&&!st.f) closeF(true);
});
document.addEventListener('keydown',e=>{
  const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if(!$('quiz').hidden){ if(e.key==='Escape') closeQuiz(); return; }
  if($('scrim').hidden){
    if(e.key==='/'&&!typing){ e.preventDefault(); $('q').focus(); }
    if(e.key==='Escape') closeF();
    return;
  }
  if(e.key==='Escape'){ if(document.fullscreenElement) return; closeDetail(); }
  if(e.key==='ArrowRight') galleryGo(1); if(e.key==='ArrowLeft') galleryGo(-1);
  if(e.key==='PageDown'||e.key==='j'){ e.preventDefault(); navGame(1); }
  if(e.key==='PageUp'||e.key==='k'){ e.preventDefault(); navGame(-1); }
  if(e.key==='Tab'){ const f=[...$('sheet').querySelectorAll('button:not(:disabled),a[href]')]; if(!f.length) return; const a=f[0], z=f[f.length-1];
    if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus();} else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus();} }
});
window.addEventListener('scroll',()=>{ $('totop').hidden=window.scrollY<900; },{passive:true});
$('totop').addEventListener('click',()=>window.scrollTo({top:0,behavior:reduced?'auto':'smooth'}));

buildIndex(); renderChrome(); render();
try{ history.replaceState({},''); }catch(e){}
setTimeout(refresh,400);
})();
</script>
